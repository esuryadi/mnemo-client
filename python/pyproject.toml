[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemo-client"
version = "1.0.0"
description = "Python client for the MNEMO API, the multi-tenant AI memory service from Panaxon AI"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "PANAXON.AI, LLC" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mnemo_client = ["py.typed"]
